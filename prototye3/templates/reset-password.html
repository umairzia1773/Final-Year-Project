<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="split-container">
        <div class="left-section">
            <div class="abstract-design">
                <div class="progress-box">
                    <p>Set a new password for your account.</p>
                </div>
            </div>
        </div>

        <div class="right-section">
            <h1>Reset Password</h1>
            <form method="POST" action="{{ url_for('reset_password') }}">
                <label for="password">New Password</label>
                <div class="password-input-container_reset">
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder="Enter password"
                        aria-describedby="password-rules-box"
                        required
                    >
                    
                    <button type="button" class="toggle-password" 
                            onclick="togglePasswordVisibility('password', this)"
        
                            data-field-id="password"
                            class="toggle-password"  
                            aria-label="Show password">
                            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" 
                height="24" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                stroke-width="2" 
                stroke-linecap="round" 
                stroke-linejoin="round"
            >
                <!-- Eye icon -->
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
                
                <!-- Slash line (hidden by default) -->
                <line id="slash" x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2" style="display: none;" />
            </svg>
            </button>
                            <!-- Small pop-up box for password rules -->
                            <div id="password-rules-box" class="password-rules-box">
                                <p>Password must meet the following requirements:</p>
                                <ol>
                                    <li id="length">At least 8 characters long</li>
                                    <li id="letters">Include at least 1 uppercase and lowercase letter</li>
                                    <li id="numbers-special">Include at least 1 number and 1 special character (@, $, etc.)</li>
                                </ol>
                            </div>
                        </div>
                
                <!-- <div id="password-error" class="feedback"></div> -->
                <button type="submit">RESET PASSWORD</button>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
