<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>

    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Include highlight.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
</head>
<body data-user-id="{{ user_id | tojson | safe }}">
    <div class="chat-container">
        <!-- History Panel -->
        <div id="history-panel" class="history-panel">
            <div class="history-header">
                <button id="new-chat-btn">
                    <i class="fas fa-plus"></i> New Chat
                </button>
            </div>
            <ul id="history-list">
                <!-- Chat history items will be inserted here -->
            </ul>
        </div>

        <!-- Main Chat Area -->
        <div id="chat-area" class="chat-area">
            <div class="chat-header">
                <div class="header-left">
                    <button id="toggle-history-btn">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="app-title">
                        <img src="static\images\images.png" alt="AI" class="app-icon">
                        <span>AI Assistant</span>
                        <!-- <span class="theme-badge">Dark Theme</span> -->
                    </div>
                </div>
                <div class="header-right">
                    <button id="theme-toggle">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>

            <div id="chat-body" class="chat-body">
                <!-- Chat messages will be inserted here -->
            </div>  

            <div class="chat-footer">
                <div class="input-container">
                    <button id="attachment-btn" class="input-button">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <textarea id="user-input" class="textarea" placeholder="Type your message..." rows="1"></textarea>
                    <button id="send-button" class="input-button">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <input type="file" id="file-input" class="hidden">
                <div class="disclaimer">
                    AI responses may not always be accurate. Verify important information.
                </div>
            </div>
        </div>
    </div>
    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.2.12/marked.min.js"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>

</body>
</html>
