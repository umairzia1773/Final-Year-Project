<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <head>
        <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    </head>
<body>
    <div class="split-container">
        <!-- Left Section -->
        <div class="left-section">
            <div class="abstract-design">
                <h2>Join Us!</h2>
                <p>Create an account to enjoy exclusive features and updates.</p>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <h1>Sign Up</h1>
            <form id="signup-form" method="POST" action="{{ url_for('signup') }}">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Your Name" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="hello@gmailz.com" required>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <button type="submit">SIGN UP</button>
            </form>
            <div class="extra-links">
                <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
                
            </div>
        </div>
    </div>
</body>
</html>
