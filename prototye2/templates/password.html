<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="split-container">
        <!-- Left Section -->
        <div class="left-section">
            <div class="abstract-design">
                <div class="progress-box">
                    <p>Feel free to enter your email address<br>We will mail with password reset instructions.</p>
                </div>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <h1>Forgot Password</h1>
            <p>Enter your email to reset your password</p>
            <form id="forgot-password-form" method="POST" action="{{ url_for('password') }}">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="hello@gmail.com" required>
                <button type="submit">SEND</button>
            </form>
        </div>
    </div>
</body>
</html>
