<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="split-container">
        <!-- Left Section -->
        <div class="left-section">
            <div class="abstract-design">
                <h2>Welcome Back!</h2>
                <p>Log in to continue and explore amazing features.</p>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <h1>Login</h1>
            <form id="login-form" action="{{ url_for('login') }}" method="POST" data-chat-url="{{ url_for('chat') }}">
                <div class="input-group">
                    <label for="email">Email</label>
                    <!-- <input type="email" id="email" placeholder="hello@gmail.com" required> -->
                    <input type="email" id="email" name="email" placeholder="hello@gmail.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <!-- <input type="password" id="password" placeholder="Enter your password" required> -->
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>

                </div>
                <button type="submit" id="login-button">LOGIN</button>
            </form>
            <div class="extra-links">
                <a href="{{ url_for('password') }}">Forgot Password?</a>
                <p>Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>

            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
